<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatten, Chatten 8</title>
  
  <!-- Collega il tuo file CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Testata del sito -->
  <header class="header">
    <h1>Lista Mosse di Chatten, Chatten 8</h1>
  </header>
  
  <!-- Contenitore principale della griglia -->
  <main class="container">
    <section class="video-grid">

      <!-- Scheda Video 1: File MP4 -->
      <article class="video-card">
        <div class="video-wrapper">
          <video 
            src="Jab.mp4" 
            muted 
            playsinline
            preload="metadata"
            onmouseenter="this.play()" 
            onmouseleave="this.pause(); this.currentTime = 0;"
            onclick="this.paused ? this.play() : this.pause();">
          </video>
        </div>
        <div class="video-content">
          <span class="video-tag">La Base</span>
          <h2 class="video-title">Jab/112</h2>
          <p class="video-description">
            La mossa più veloce di Steve, Steve Fox.
          </p>
          <div class="video-meta">
          </div>
        </div>
      </article>

    </section>
  </main>

</body>
</html>
