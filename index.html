<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatten, Chatten 8</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Lista Mosse di Chatten, Chatten 8</h1>
  </header>
  
  <main class="container">
    <section class="video-grid">

      <article class="video-card">
        <div class="video-wrapper">
          <!-- Sostituito l'iframe con un tag img per la GIF -->
          <img 
            src="Adobe Express - Jab.gif" 
            alt="Jab/112" 
            class="gif-player"
            id="gifJab"
            onclick="playGif()"
            onmouseenter="playGif()"
            onmouseleave="resetGif()">
        </div>
        <div class="video-content">
          <span class="video-tag">La Base</span>
          <h2 class="video-title">Jab/112</h2>
          <p class="video-description">
            La mossa più veloce di Steve, Steve Fox.
          </p>
          <div class="video-meta">
          </div>
        </div>
      </article>

    </section>
  </main>

  <!-- Script semplice per gestire il play/reset della GIF -->
  <script>
    const gif = document.getElementById('gifJab');
    const gifSrc = gif.src;

    function playGif() {
      // Forza il browser a ricaricare la GIF facendola ripartire da capo
      gif.src = '';
      gif.src = gifSrc;
    }

    function resetGif() {
      // Se vuoi che si blocchi/stoppi quando esci con il mouse, 
      // puoi lasciare la funzione vuota o reimpostarla.
    }
  </script>

</body>
</html>
